<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#293421" />
  <title>Worldcore — 彩琳的赛道手账</title>
  <meta name="description" content="彩琳的设计与开发作品集，以马从左向右奔跑的 2D 叙事方式展示项目与联系信息。" />
  <link rel="preload" as="image" href="assets/backgrounds-webp/bg_0.webp" />
  <link rel="stylesheet" href="styles.css?v=trail-11" />
</head>
<body>
  <div class="demo-track" id="demoTrack">
    <section class="demo-stage" id="demoStage">
      <div class="scene-stack" aria-hidden="true">
        <div class="scene" data-scene="0" data-label="森林深处">
          <img src="assets/backgrounds-webp/bg_0.webp" alt="" loading="eager" decoding="async" />
        </div>
        <div class="scene" data-scene="1" data-label="森林">
          <img src="assets/backgrounds-webp/bg_1.webp" alt="" loading="eager" decoding="async" />
        </div>
        <div class="scene" data-scene="2" data-label="森林到草地">
          <img src="assets/backgrounds-webp/bg_2.webp" alt="" loading="eager" decoding="async" />
        </div>
        <div class="scene" data-scene="3" data-label="草地">
          <img src="assets/backgrounds-webp/bg_3.webp" alt="" loading="lazy" decoding="async" />
        </div>
        <div class="scene" data-scene="4" data-label="草地傍晚">
          <img src="assets/backgrounds-webp/bg_4.webp" alt="" loading="lazy" decoding="async" />
        </div>
        <div class="scene" data-scene="5" data-label="牧场">
          <img src="assets/backgrounds-webp/bg_5.webp" alt="" loading="lazy" decoding="async" />
        </div>
        <div class="scene" data-scene="6" data-label="林间傍晚">
          <img src="assets/backgrounds-webp/bg_6.webp" alt="" loading="lazy" decoding="async" />
        </div>
        <div class="scene" data-scene="7" data-label="草原傍晚">
          <img src="assets/backgrounds-webp/bg_7.webp" alt="" loading="lazy" decoding="async" />
        </div>
        <div class="scene" data-scene="8" data-label="森林晚">
          <img src="assets/backgrounds-webp/bg_8.webp" alt="" loading="lazy" decoding="async" />
        </div>
      </div>

      <div class="atmosphere" aria-hidden="true">
        <div class="sun" id="sun"></div>
        <div class="light-wash"></div>
        <div class="vignette"></div>
        <div class="grain"></div>
      </div>


      <svg class="trail-svg" id="trailSvg" aria-hidden="true">
        <defs>
          <clipPath id="trailClip" clipPathUnits="userSpaceOnUse">
            <rect id="trailClipRect" x="0" y="0" width="10000" height="10000" />
          </clipPath>
        </defs>
        <g clip-path="url(#trailClip)">
          <path id="trailLine" class="trail-line" fill="none" stroke="#c8d8ff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 13" />
          <g id="trailPrints"></g>
        </g>
      </svg>

      <div class="horse-center" id="horseCenter" aria-label="在画面中央奔跑的马">
        <div class="horse-shadow"></div>
        <img id="centerHorseFrame" src="assets/horse-webp/frame_01.webp" alt="" decoding="async" />
      </div>


      <div class="portfolio-layer" aria-label="作品集入口">
        <div class="portfolio-landmark" id="echoLandmark">
          <div class="hoof-trail" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
          <a class="project-link" id="echoLink" href="#" aria-label="查看项目 echo">
            <span class="project-name">echo</span>
            <span class="project-arrow">↗</span>
          </a>
        </div>
      </div>



      <div class="hoof-layer" aria-label="精选项目">
        <a class="hoof-link" data-reveal="0.25" href="#" aria-label="查看 echo 项目一">
          <span class="hoof-label">echo <b>↗</b></span>
        </a>
        <a class="hoof-link" data-reveal="0.50" href="#" aria-label="查看 echo 项目二">
          <span class="hoof-label">echo <b>↗</b></span>
        </a>
        <a class="hoof-link" data-reveal="0.75" href="#" aria-label="查看 echo 项目三">
          <span class="hoof-label">echo <b>↗</b></span>
        </a>
      </div>

      <header class="demo-header">
        <span class="demo-badge">WORLDCORE</span>
        <strong>彩琳的赛道手账</strong>
        <span>向下滚动 · Echo cases</span>
      </header>

      <div class="chapter" id="chapter">森林 · 开始</div>

      <div class="progress">
        <span id="progressText">00</span>
        <div class="progress-track"><i id="progressBar"></i></div>
        <span>100</span>
      </div>

      <div class="scroll-cue">
        <span>向下滚动</span>
        <i></i>
      </div>

    </section>
  </div>
  <script src="script.js?v=trail-11"></script>
</body>
</html>
